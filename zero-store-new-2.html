<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZERO | متجر محمود</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0;font-size:36px;letter-spacing:3px}header p{margin:8px 0;color:#ccc}
nav{background:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
nav button,.add{background:#111;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin:4px;cursor:pointer}
main{max-width:1100px;margin:25px auto;padding:0 14px}h2{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #0002}
.photo{height:230px;background:#e9e9e9;display:flex;align-items:center;justify-content:center;color:#777;font-size:19px}
.info{padding:15px}.info h3{margin:0 0 8px;font-size:19px}.price{font-size:20px;font-weight:bold;margin:10px 0}
.add{width:100%;margin:0;padding:12px;font-size:16px}.cart{background:#fff;border-radius:12px;padding:16px;margin-top:25px;text-align:center}
footer{background:#111;color:#fff;text-align:center;padding:22px;margin-top:35px}
</style>
</head>
<body>
<header><h1>ZERO</h1><p>ستايلك يبدأ من الصفر</p></header>
<nav>
<button onclick="render(products)">كل المنتجات</button>
<button onclick="filterProducts('top')">تيشيرتات وبولو</button>
<button onclick="filterProducts('pants')">البناطيل</button>
</nav>
<main>
<h2>مجموعة 2026</h2>
<section class="grid" id="products"></section>
<div class="cart"><strong>السلة: <span id="cartCount">0</span> قطعة</strong></div>
</main>
<footer>ZERO © 2026 — جميع الأسعار بالجنيه المصري</footer>
<script>
const products=[
{name:"بولو أسود مخطط أبيض",price:450,cat:"top"},
{name:"بولو أسود مخطط موديل 2",price:450,cat:"top"},
{name:"جينز رمادي واسع",price:600,cat:"pants"},
{name:"بنطلون أسود مخطط",price:550,cat:"pants"},
{name:"بنطلون أسود كلاسيك",price:550,cat:"pants"},
{name:"بنطلون أبيض كاجوال",price:500,cat:"pants"},
{name:"بنطلون رياضي رمادي",price:450,cat:"pants"},
{name:"بنطلون رياضي أسود",price:450,cat:"pants"},
{name:"بنطلون أسود كاجوال",price:500,cat:"pants"},
{name:"بنطلون بيج كلاسيك",price:550,cat:"pants"}
];
let cartCount=0;
function render(list){
const box=document.getElementById("products");box.innerHTML="";
list.forEach(function(p){
const card=document.createElement("article");card.className="card";
card.innerHTML='<div class="photo">صورة المنتج</div><div class="info"><h3>'+p.name+'</h3><div class="price">'+p.price+' جنيه</div><button class="add" onclick="addToCart()">أضف للسلة</button></div>';
box.appendChild(card);
});
}
function addToCart(){cartCount++;document.getElementById("cartCount").textContent=cartCount;}
function filterProducts(cat){render(products.filter(function(p){return p.cat===cat;}));}
render(products);
</script>
</body>
</html>
